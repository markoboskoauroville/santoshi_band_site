<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Santoshi Band live</title><meta name="robots" content="noindex">
<meta name="description" content="Santoshi Kirtan Band, live. The band's own player.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/img/favicon.png?v=2" type="image/png" sizes="64x64">
<link rel="icon" href="/img/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="shortcut icon" href="/img/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2">
<style>
:root{--bg:#000;--fg:#f1e8d8;--amber:#e8a33d;--disc:rgba(11,13,16,.62);--edge:rgba(255,255,255,.38)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:600 15px system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#msg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 16px;text-shadow:0 1px 3px #000}
body.top #msg{top:calc(50% + 124px);transform:none}
#snd{position:absolute;top:12px;left:50%;transform:translateX(-50%);border:1px solid var(--amber);background:#0B0D10c0;color:var(--fg);border-radius:22px;padding:8px 16px;font:600 14px system-ui,sans-serif;cursor:pointer}
#st{position:absolute;right:8px;top:8px;font:12px ui-monospace,Menlo,monospace;background:#000a;padding:4px 6px;border-radius:6px;white-space:pre}
[hidden]{display:none!important}
/* full view (not inside the banner) */
#hit{position:absolute;inset:0;z-index:1}
#hit.pan{touch-action:none;cursor:grab}#hit.pan:active{cursor:grabbing}
#ov{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .45s}
#ov.gone{opacity:0;pointer-events:none}
#big{position:relative;width:176px;height:176px;border-radius:50%;border:2px solid var(--amber);background:var(--disc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0;cursor:pointer;font:700 14px/1.15 system-ui,sans-serif;letter-spacing:.12em;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 28px rgba(0,0,0,.5)}
#big svg{width:60px;height:60px;display:block;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#big::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--amber);animation:ring 2.2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){#big::after{animation:none;display:none}}
#bar{position:absolute;z-index:4;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));padding:0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));display:flex;justify-content:center;gap:12px;transition:opacity .3s,visibility 0s}
#bar.off{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s,visibility 0s .3s}
.rb{position:relative;flex:none;width:56px;height:56px;border-radius:50%;border:1px solid var(--edge);background:var(--disc);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.45);color:#fff}
.rb svg{width:28px;height:28px;display:block;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb:hover{border-color:var(--amber)}.rb:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.rb[aria-pressed="true"]{background:var(--amber);border-color:var(--amber)}.rb[aria-pressed="true"] svg{stroke:#0B0D10}
.rb i{position:absolute;top:4px;right:4px;width:12px;height:12px;border-radius:50%;background:#ff4d3d;border:2px solid #0B0D10;display:none}.rb.new i{display:block}
#stage>.b.ch{display:none}
/* CHAT beside or below the picture, never over it (Marko, 15.11.2026, "same as on YouTube"): ui.js sets body.cw (wide: panel docked right, 360 px) or body.cn (narrow: panel below, 320 px) while the chat is open */
body.cw #stage{right:360px}body.cw .sbc{width:360px!important;top:0!important;bottom:0!important;height:100%!important}
body.cn #stage{bottom:320px}body.cn .sbc{top:auto!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:320px!important;border-left:0!important;border-top:1px solid #3a3128!important}
body.cw #stage,body.cn #stage{transition:none}
.sbc-badge{top:calc(8px + env(safe-area-inset-top))!important;left:calc(8px + env(safe-area-inset-left))!important}
/* the ONE sound drawer: the speaker is the first round button, the drawer slides UP from it */
.sw{position:relative;flex:none}
/*DR*/.dr{position:absolute;left:0;bottom:calc(100% + 12px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 12px 10px;border-radius:28px;border:1px solid var(--edge);background:var(--disc);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 14px rgba(0,0,0,.55);animation:sdup .22s ease-out;max-width:calc(100vw - 32px);box-sizing:border-box}
@keyframes sdup{from{opacity:0;transform:translateY(14px) scaleY(.85)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dr{animation:none}}
.dr .fr{display:flex;gap:14px}.dr .ac{display:flex;flex-direction:column;gap:10px;width:100%}.fc.dis{opacity:.35}
.fc{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px}
.fv{font:700 12px system-ui,sans-serif;color:var(--fg);height:16px}.fl{font:700 10px system-ui,sans-serif;letter-spacing:.12em;color:#a39a8a}
.ft{position:relative;width:44px;height:clamp(110px,calc(100vh - 330px),180px);border-radius:22px;background:rgba(255,255,255,.14);border:1px solid var(--edge);cursor:pointer;touch-action:none;outline:none}
.ft i{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 22px 22px;background:var(--amber);opacity:.85;pointer-events:none}
.ft b{position:absolute;left:50%;width:30px;height:18px;margin-left:-15px;border-radius:9px;background:#fff;box-shadow:0 1px 4px #000a;pointer-events:none}
.ft:focus-visible{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.vm{flex:none;width:100%;min-width:44px;height:44px;border-radius:24px;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px 0 10px;cursor:pointer;font:700 12px system-ui,sans-serif;letter-spacing:.1em}
.vm svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vm:hover,.vm:focus-visible{border-color:var(--amber);outline:none}
.rb.open{border-color:var(--amber)}
.vm.dn{display:none}
.ql{display:flex;flex-direction:column;gap:8px;min-width:210px;max-height:280px;overflow:auto}.ql .qh{align-self:flex-start;margin:2px 0 0 4px}.qn{font:600 12px system-ui,sans-serif;color:#a39a8a;padding:2px 6px}
.vm.opt{justify-content:flex-start;letter-spacing:.04em;font-size:14px;padding:0 16px}.vm.opt[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#0B0D10}
/* a small picture (the home page's frame on a phone, a phone held sideways): the drawer fills the picture, the faders take the height, DONE closes it */
@media (max-height:360px){.dr{position:fixed;left:8px!important;right:8px;top:8px;bottom:8px;max-width:none;z-index:7;padding:10px 14px;gap:10px;display:grid;grid-template-columns:auto 1fr;align-items:center;justify-items:stretch}
.dr .fr{grid-column:1;height:100%;align-self:stretch;justify-content:center}.fc{height:100%;width:56px}.ft{flex:1;height:auto;min-height:0}.fl{display:none}
.dr .ac{grid-column:2;justify-content:center}.dr .vm{height:44px}.vm.dn{display:flex}}
video{transform:translate(var(--tx,0px),var(--ty,0px)) scale(var(--z,1));transform-origin:50% 50%}
/* seven round buttons must fit a 366 px frame: 44 px each (still thumb size), 6 px apart */
@media (max-width:440px){#bar{gap:6px;padding-left:calc(8px + env(safe-area-inset-left));padding-right:calc(8px + env(safe-area-inset-right))}#bar .rb{width:44px!important;height:44px!important}#bar .rb svg{width:22px!important;height:22px!important}}
/* small window fallback: the picture shrinks into the corner, a tap makes it big again */
body.mini video{inset:auto;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:min(46vw,360px);height:auto;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--amber);z-index:6;cursor:pointer;box-shadow:0 6px 24px #000c}
body.mini #bar,body.mini #ov{display:none}
body.mini video{transform:none}
#minihint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 24px;color:#a39a8a;font-size:15px}
</style></head>
<body><div id="stage"><video id="v" playsinline autoplay></video><div id="msg">Connecting to the stream…</div><button id="snd" hidden>Tap for sound</button><div id="st" hidden></div></div>
<script src="/live/studio.js?v=1"></script><script src="/live/player.js?v=10"></script><script src="/live/ui.js?v=12"></script></body></html>
