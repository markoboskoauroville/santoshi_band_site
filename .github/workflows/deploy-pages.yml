name: Deploy to Cloudflare Pages
# santoshi_band_site (public, 8.11.2026): only the published files of the Santoshi sites, so GitHub Actions runs free.
# The workshop (notes, drafts, build tools) stays in the private repo santoshi_band, whose tools/publish_site.sh copies
# the built page here and pushes.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy both sites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; fi
          # the private reference sheets leave the public tree: on the first run they are moved from history into KV
          OLD=$(git log --diff-filter=D -1 --format=%H -- refs/sheets/index.json || true)
          mkdir -p "$RUNNER_TEMP/sheets"
          if [ -n "$OLD" ]; then git archive "$OLD^" refs/sheets | tar -x -C "$RUNNER_TEMP"; mv "$RUNNER_TEMP"/refs/sheets/* "$RUNNER_TEMP/sheets/" 2>/dev/null || true; fi
          python3 tools/provision.py "$RUNNER_TEMP/sheets"
          bash tools/deploy.sh
