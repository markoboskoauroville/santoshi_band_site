name: Deploy to Cloudflare Pages
# santoshi_band_site (public, 8.11.2026): only the published files of the Santoshi sites, so GitHub Actions runs free.
# The workshop (notes, drafts, build tools) stays in the private repo santoshi_band, whose tools/publish_site.sh copies
# the built page here and pushes.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax check of every script (14.11.2026, a stray ")" in admin/live.js killed the sign-in button)
        run: |
          set -e
          for f in admin/*.js sbchat.js sbctl.js; do node --check "$f"; done
          for f in functions/*.js functions/api/*.js room/*.js; do node --input-type=module --check < "$f" || { echo "::error::syntax error in $f"; exit 1; }; done
      - name: Deploy the live room (chat + watching count, Durable Object worker room/)
        id: room
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # needs the token rights "Workers Scripts: Edit" (Durable Objects come with it); without them the site still deploys, chat off
          set -o pipefail; cd room
          if ! npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/room.log"; then
            if grep -qiE "authentication|10000|permission|not authorized|forbidden" "$RUNNER_TEMP/room.log"; then
              echo "::error::The Cloudflare token cannot deploy Workers: add the permission 'Account > Workers Scripts > Edit' to CLOUDFLARE_API_TOKEN"
            else echo "::error::The live room worker did not deploy (see the log above)"; fi
            exit 1
          fi
      - name: Deploy both sites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ROOM_DEPLOYED: ${{ steps.room.outcome }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; fi
          # the private reference sheets leave the public tree: on the first run they are moved from history into KV
          OLD=$(git log --diff-filter=D -1 --format=%H -- refs/sheets/index.json || true)
          mkdir -p "$RUNNER_TEMP/sheets"
          if [ -n "$OLD" ]; then git archive "$OLD^" refs/sheets | tar -x -C "$RUNNER_TEMP"; mv "$RUNNER_TEMP"/refs/sheets/* "$RUNNER_TEMP/sheets/" 2>/dev/null || true; fi
          python3 tools/provision.py "$RUNNER_TEMP/sheets"
          bash tools/deploy.sh
