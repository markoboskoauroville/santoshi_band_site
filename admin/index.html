<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Santoshi Band · Admin</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="/img/favicon.png?v=2" type="image/png" sizes="64x64">
<link rel="icon" href="/img/favicon-32.png?v=2" type="image/png" sizes="32x32">
<style>
:root{--bg:#14110e;--fg:#f1e8d8;--mut:#a39a8a;--card:#201b16;--line:#3a3128;--acc:#e8a33d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:24px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1rem;letter-spacing:.15em;color:var(--acc);margin:32px 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sub{color:var(--mut);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;padding:0;color:inherit;text-align:left;font:inherit}
.card:focus-visible,.card:hover{border-color:var(--acc)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#000}
.card div{padding:8px 10px;font-size:.85rem}.card b{display:block;font-size:.95rem}.card span{color:var(--mut)}
.none{color:var(--mut)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;padding:12px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:calc(100% - 56px);object-fit:contain}
#cap{margin-top:8px;color:var(--fg);font-size:.9rem;text-align:center}
#lb button{position:absolute;background:none;border:0;color:var(--fg);font-size:2.2rem;cursor:pointer;padding:12px}
#x{top:4px;right:8px}#pv{left:4px;top:50%}#nx{right:4px;top:50%}

body{max-width:980px;margin:0 auto}
button.go{display:block;width:100%;max-width:420px;margin:18px 0;padding:16px 18px;font:600 1.05rem system-ui;background:var(--acc);color:#14110e;border:0;border-radius:10px;cursor:pointer}
button.go.stop{background:#c0392b;color:#fff}.tabs{display:flex;gap:8px;margin:18px 0}
.tabs button{flex:1;padding:12px;font:600 .95rem system-ui;letter-spacing:.12em;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.tabs button.on{color:var(--fg);border-color:var(--acc)}.pane{display:none}.pane.on{display:block}
#msg{color:var(--mut);margin:10px 0;min-height:1.4em;white-space:pre-wrap}#msg.bad{color:#ff7b6b}#msg.good{color:#8fd18f}
.cam{width:100%;max-width:420px;aspect-ratio:3/4;background:#000;border-radius:8px;margin:8px 0}
iframe#snd{width:100%;height:420px;border:0;background:#000;border-radius:8px}
</style></head><body>
<h1>Santoshi Band &middot; Admin</h1><div class="sub" id="sub">Private &middot; sign in</div>
<div id="in"><button class="go" id="g">Sign in with Google</button><div id="msg0" class="sub"></div></div>
<div id="app" style="display:none">
<div class="tabs"><button id="t1" class="on">PICTURES</button><button id="t2">LIVE</button></div>
<div class="pane on" id="p1"><div class="sub">Private collection &middot; reference sheets &middot; not public</div>
<h2>PEOPLE</h2><div class="grid" id="people"></div><h2>INSTRUMENTS</h2><div class="grid" id="instruments"></div></div>
<div class="pane" id="p2"><button class="go" id="go">GO LIVE</button><div id="msg"></div>
<div id="sndw" style="position:relative;max-width:420px;display:none"><iframe id="snd" allow="camera; microphone; autoplay" style="display:block" title="Sender"></iframe></div>
<div class="sub" id="recinfo"></div><button class="go" id="out" style="background:var(--card);color:var(--mut);border:1px solid var(--line)">Sign out</button></div>
</div>
<div id="lb"><button id="x" aria-label="Close">&times;</button><button id="pv" aria-label="Previous">&#8249;</button><button id="nx" aria-label="Next">&#8250;</button><img alt=""><div id="cap"></div></div>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="/sbctl.js?v=1"></script>
<script src="/admin/live.js?v=2"></script>
<script src="/admin/pics.js?v=1"></script>
</body></html>
